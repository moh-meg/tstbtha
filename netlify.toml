[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/matches"
  to = "/.netlify/functions/matches"
  status = 200
  force = true

[[redirects]]
  from = "/api/players"
  to = "/.netlify/functions/players"
  status = 200
  force = true

[[redirects]]
  from = "/api/fpl-squad"
  to = "/.netlify/functions/fpl-squad"
  status = 200
  force = true

[[redirects]]
  from = "/api/player-photo"
  to = "/.netlify/functions/player-photo"
  status = 200
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
